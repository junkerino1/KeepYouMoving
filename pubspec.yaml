name: prasarana_live_transit
description: "A gorgeous, high-fidelity Prasarana Kuala Lumpur Bus Transit & Live Tracking app built with Flutter."
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cloudflare_turnstile: ^3.8.1
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_secure_storage: ^10.2.0
  geolocator: ^11.0.0
  http: ^1.6.0
  latlong2: ^0.9.1
  package_info_plus: ^10.2.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/providers.json
    # App logo used by the bootstrap splash. A placeholder lives at
    # assets/logo.png; replace the file with the final brand logo (same name).
    - assets/logo.png
